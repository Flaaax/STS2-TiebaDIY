<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">

    <defs>
        <!-- 金属渐变 -->
        <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFF2A8"/>
            <stop offset="25%" stop-color="#FFD700"/>
            <stop offset="60%" stop-color="#D4AF37"/>
            <stop offset="100%" stop-color="#8B6508"/>
        </linearGradient>

        <!-- 文字阴影 -->
        <filter id="shadow">
            <feGaussianBlur stdDeviation="1.2"/>
        </filter>
    </defs>

    <!-- 黑色底 -->
    <circle cx="64" cy="64" r="58" fill="#181818" stroke="#6B4F00" stroke-width="8"/>

    <!-- 黄金外圈 -->
    <circle cx="64" cy="64" r="55" fill="none" stroke="url(#gold)" stroke-width="3"/>

    <!-- 内圈装饰 -->
    <circle cx="64" cy="64" r="48" fill="none" stroke="#8B6508" stroke-width="1"/>


    <!-- DIY 阴影 -->
    <g transform="translate(-12 2)" fill="#5A4000" filter="url(#shadow)">
        <path d="M28 34V94H45C60 94 68 84 68 64C68 44 60 34 45 34H28ZM39 45H44C52 45 56 51 56 64C56 77 52 83 44 83H39V45Z"/>
        <rect x="72" y="34" width="11" height="60"/>
        <path d="M86 34H98L105 52L112 34H124L111 66V94H100V66L86 34Z"/>
    </g>


    <!-- DIY 金字 -->
    <g transform="translate(-12 0)" fill="url(#gold)">
        <path d="M28 34V94H45C60 94 68 84 68 64C68 44 60 34 45 34H28ZM39 45H44C52 45 56 51 56 64C56 77 52 83 44 83H39V45Z"/>
        <rect x="72" y="34" width="11" height="60"/>
        <path d="M86 34H98L105 52L112 34H124L111 66V94H100V66L86 34Z"/>
    </g>

</svg>